<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Goodyear Toastmasters Slideshow</title>
  <style>
    body { margin:0; background:#fff; }
    .slideshow-container { max-width: 100%; position: relative; margin: auto; }
    .mySlides { display: none; }
    .mySlides img { width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="slideshow-container">
    <div class="mySlides"><img src="slide1.jpg" alt="Club photo 1"></div>
    <div class="mySlides"><img src="slide2.jpg" alt="Club photo 2"></div>
    <div class="mySlides"><img src="slide3.jpg" alt="Club photo 3"></div>
  </div>

  <script>
  let slideIndex = 0;
  showSlides();
  function showSlides() {
    let slides = document.getElementsByClassName("mySlides");
    for (let i = 0; i < slides.length; i++) { slides[i].style.display = "none"; }
    slideIndex++;
    if (slideIndex > slides.length) { slideIndex = 1; }
    slides[slideIndex-1].style.display = "block";
    setTimeout(showSlides, 4000); // 4 seconds
  }
  </script>
</body>
</html>
